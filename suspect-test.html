<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suspect & Hierarchy Test Bench</title>
  <style>
    :root {
      --bg: #11151c;
      --panel: #19202b;
      --card: #222b3a;
      --text: #eef2f7;
      --muted: #9aa7b8;
      --accent: #4ea8de;
      --warn: #f4a261;
      --good: #52b788;
      --border: #313d52;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.35rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      color: #091018;
      border-color: var(--accent);
      font-weight: 600;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .breadcrumbs {
      background: #2b2318;
      border: 1px solid var(--warn);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 0.9rem;
    }

    .breadcrumbs:empty {
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .name {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .badge.mononym {
      border-color: var(--warn);
      color: var(--warn);
    }

    .meta {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .detail-list {
      margin: 0;
      padding-left: 16px;
      font-size: 0.84rem;
    }

    .detail-list li {
      margin-bottom: 3px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 6px;
    }

    .card-actions button {
      flex: 1;
      padding: 6px 8px;
      font-size: 0.8rem;
    }

    .log-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: var(--muted);
      max-height: 180px;
      overflow-y: auto;
    }

    .log-entry {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <h1>Suspect &amp; Hierarchy Test Bench</h1>

  <div class="controls">
    <button id="btn-new-case" class="primary">New Case</button>
    <button id="btn-pull-thread">Pull Thread</button>
    <button id="btn-roll-100">Roll 100 Fresh (Check Odds)</button>
  </div>

  <div id="stats" class="stats"></div>
  <div id="breadcrumbs" class="breadcrumbs"></div>
  <div id="board" class="grid"></div>

  <div class="log-box" id="log"></div>


<!-- Script tags go right before closing body -->
<script src="js/world-factbook.js"></script>  
<script src="js/suspect-generator.js"></script>
  <script src="js/crime-generator.js"></script>
  <script src="js/suspect-ui.js"></script>
</body>
</html>
